[package]
name = "order-wizard-cli"
version.workspace = true
edition.workspace = true
description = "Agent-friendly CLI for Order Wizard"
license.workspace = true

[[bin]]
name = "order-wizard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
keyring = { version = "4.2", features = ["v1"] }
open = "5"
rmcp = { version = "=3.1.4", features = ["server", "macros", "transport-io"] }
schemars = "1.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
