# Local MongoDB for server development. The Fly deployment builds ./Dockerfile instead.
# The project name keeps the volume created by the former root compose file.
name: order-wizard

services:
  mongodb:
    image: mongo:8.2
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=order_wizard

volumes:
  mongo-data:
    driver: local
