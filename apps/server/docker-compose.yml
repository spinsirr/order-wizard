services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_DATABASE: order_wizard

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017
      - RESOURCE_URI=${RESOURCE_URI:-http://localhost:3000}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLI_CLIENT_ID=${OIDC_CLI_CLIENT_ID:-}
    depends_on:
      - mongo

volumes:
  mongo_data:
