name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.2
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node for frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Install extension dependencies
        working-directory: apps/extension
        run: bun install --frozen-lockfile

      - name: Check version consistency
        run: bun scripts/set-version.ts --check

      - name: Extension typecheck
        working-directory: apps/extension
        run: bun run typecheck

      - name: Extension lint
        working-directory: apps/extension
        run: bun run lint

      - name: Extension design conventions
        working-directory: apps/extension
        run: bun run check:design

      - name: Extension tests
        working-directory: apps/extension
        run: bun run test

      - name: Extension build
        working-directory: apps/extension
        run: bun run build

      - name: Demo build
        working-directory: apps/extension
        run: bun run build:demo

      - name: Storybook build
        working-directory: apps/extension
        run: bun run build-storybook

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: MongoDB replication regression
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
        run: cargo test -p server --lib mongo_replication --locked -- --ignored
