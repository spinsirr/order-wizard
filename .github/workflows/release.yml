name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Verify release commit
    uses: ./.github/workflows/ci.yml

  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION=$(jq -r '.version' package.json)

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must use v<major>.<minor>.<patch>."
            exit 1
          fi

          if [ "$VERSION" != "$ROOT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $ROOT_VERSION."
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  extension:
    name: Build extension
    needs: [checks, version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        working-directory: apps/extension
        run: bun install --frozen-lockfile

      - name: Build production extension
        working-directory: apps/extension
        run: bun run build
        env:
          VITE_COGNITO_AUTHORITY: ${{ secrets.VITE_COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Package extension
        working-directory: apps/extension
        run: |
          cd .output/chrome-mv3
          zip -qr "../../amazon-order-wizard-v${{ needs.version.outputs.version }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: apps/extension/amazon-order-wizard-v${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  cli:
    name: Build CLI (${{ matrix.os }})
    needs: [checks, version]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Detect host target
        id: host
        shell: bash
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"

      - name: Build CLI
        run: cargo build --locked --release -p ordercue-cli

      - name: Package CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ordercue dist/ordercue
          tar -C dist -czf "ordercue-${VERSION}-${{ steps.host.outputs.triple }}.tar.gz" ordercue

      - name: Package CLI for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ordercue.exe dist/ordercue.exe
          Compress-Archive -Path dist/ordercue.exe -DestinationPath "ordercue-$env:VERSION-${{ steps.host.outputs.triple }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ steps.host.outputs.triple }}
          path: ordercue-*
          if-no-files-found: error

  deploy:
    name: Deploy server
    needs: [version, extension, cli]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Stage CLI and MCP configuration
        shell: bash
        run: |
          CONFIG=()
          for NAME in OIDC_CLI_CLIENT_ID OIDC_MCP_CLIENT_IDS MCP_ALLOWED_HOSTS MCP_ALLOWED_ORIGINS; do
            if [ -n "${!NAME}" ]; then
              CONFIG+=("$NAME=${!NAME}")
            fi
          done
          if [ "${#CONFIG[@]}" -gt 0 ]; then
            flyctl secrets set --app order-wizard-api --stage "${CONFIG[@]}"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OIDC_CLI_CLIENT_ID: ${{ secrets.OIDC_CLI_CLIENT_ID }}
          OIDC_MCP_CLIENT_IDS: ${{ secrets.OIDC_MCP_CLIENT_IDS }}
          MCP_ALLOWED_HOSTS: ${{ secrets.MCP_ALLOWED_HOSTS }}
          MCP_ALLOWED_ORIGINS: ${{ secrets.MCP_ALLOWED_ORIGINS }}

      - name: Deploy tagged commit
        shell: bash
        run: |
          IMAGE_LABEL="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          flyctl deploy . \
            --config apps/server/fly.toml \
            --dockerfile apps/server/Dockerfile \
            --remote-only \
            --strategy canary \
            --image-label "$IMAGE_LABEL" \
            --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://order-wizard-api.fly.dev/health

  publish:
    name: Publish GitHub Release
    needs: [version, extension, cli, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  chrome-web-store:
    name: Upload Chrome Web Store draft
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        working-directory: apps/extension
        run: bun install --frozen-lockfile

      - name: Download release extension
        uses: actions/download-artifact@v4
        with:
          name: extension
          path: apps/extension

      - name: Upload draft without submitting for review
        working-directory: apps/extension
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          : "${CHROME_EXTENSION_ID:?Missing CHROME_EXTENSION_ID repository secret}"
          : "${CHROME_CLIENT_ID:?Missing CHROME_CLIENT_ID repository secret}"
          : "${CHROME_CLIENT_SECRET:?Missing CHROME_CLIENT_SECRET repository secret}"
          : "${CHROME_REFRESH_TOKEN:?Missing CHROME_REFRESH_TOKEN repository secret}"
          bunx --no-install wxt submit \
            --chrome-zip "amazon-order-wizard-v${{ needs.version.outputs.version }}.zip" \
            --chrome-skip-submit-review
