[workspace]
members = ["apps/cli", "apps/server"]
resolver = "2"

[workspace.package]
version = "1.0.14"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
